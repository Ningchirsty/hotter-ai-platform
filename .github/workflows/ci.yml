name: Backend CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and publish exact tested images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          gh run download 37944993754 --repo Ningchirsty/hotter-ai-platform --name backend-image-225398056b1f44aa14596333cf40a14978b41199 --dir backend
          (cd backend && sha256sum -c SHA256SUMS)
          docker load --input backend/backend-image.tar.gz
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' hotter-ai-platform-backend:225398056b1f44aa14596333cf40a14978b41199)" = 225398056b1f44aa14596333cf40a14978b41199
          docker tag hotter-ai-platform-backend:225398056b1f44aa14596333cf40a14978b41199 ghcr.io/ningchirsty/hotter-ai-platform-backend:sha-225398056b1f44aa14596333cf40a14978b41199
          docker push ghcr.io/ningchirsty/hotter-ai-platform-backend:sha-225398056b1f44aa14596333cf40a14978b41199
          gh run download 37944998113 --repo Ningchirsty/hotter-ai-platform --name frontend-image-225398056b1f44aa14596333cf40a14978b41199 --dir frontend
          (cd frontend && sha256sum -c SHA256SUMS)
          docker load --input frontend/frontend-image.tar.gz
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' hotter-ai-platform-frontend:225398056b1f44aa14596333cf40a14978b41199)" = 225398056b1f44aa14596333cf40a14978b41199
          docker tag hotter-ai-platform-frontend:225398056b1f44aa14596333cf40a14978b41199 ghcr.io/ningchirsty/hotter-ai-platform-frontend:sha-225398056b1f44aa14596333cf40a14978b41199
          docker push ghcr.io/ningchirsty/hotter-ai-platform-frontend:sha-225398056b1f44aa14596333cf40a14978b41199
