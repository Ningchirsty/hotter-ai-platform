name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: backend-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-image:
    name: Compile, test and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE: hotter-ai-platform-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        run: bash mvnw --batch-mode --no-transfer-progress -Dmaven.test.skip=false '-Dtest.groups=!exclude' verify

      - name: Verify tests actually ran
        run: python3 script/ci/check-test-results.py

      - name: Upload test reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.sha }}
          overwrite: true
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
          retention-days: 14

      - name: Package JAR with checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts/jar
          cp ruoyi-admin/target/ruoyi-admin.jar artifacts/jar/
          cd artifacts/jar
          sha256sum ruoyi-admin.jar > SHA256SUMS

      - name: Upload backend JAR
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          overwrite: true
          path: artifacts/jar/
          if-no-files-found: error
          retention-days: 7

      # ffmpeg 归档只下载一次并缓存，之后所有构建走缓存。
      #
      # 为什么不留给 Dockerfile 下载：该源站会对单个连接限速（实测每次请求 20 秒只能
      # 收到 0.8–7 MB，而归档共 41.9 MB），且 curl 的 --retry 不会对「传输太慢」重试。
      # 已因此让本流水线失败过两次。放在这里可以：只下一次、失败可重试整步、
      # 并通过缓存让后续构建完全不再访问该源。
      - name: Cache ffmpeg static archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache
          key: ffmpeg-static-abda8d77ce830914-41888096

      - name: Fetch ffmpeg static archive
        run: bash script/ci/fetch-ffmpeg.sh build-cache

      - name: Build backend image
        run: |
          # 构建上下文是仓库根（不是 ruoyi-admin）：镜像需要包含
          # script/video/workflows 下的工作流契约与模板，而 Docker 不允许
          # COPY 构建上下文之外的文件。Dockerfile 位于仓库根。
          # build-cache/ 内的 ffmpeg 归档由上一步预取，Dockerfile 直接 COPY。
          docker build --pull \
            -f Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" .

      - name: Smoke test image runtime and packaged JAR
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE" -ec \
            'java -version; test -s /ruoyi/server/app.jar; test -w /ruoyi/server/logs; test -w /ruoyi/server/temp'

      - name: Smoke test packaged contracts and media tools
        run: |
          # 契约与模板是后端启动依赖，缺失会导致上下文初始化失败；
          # ffprobe/ffmpeg 是成片实测与截断的运行时依赖。
          # 这里显式校验，避免出现「镜像能构建但跑不起来」。
          docker run --rm --entrypoint /bin/bash "$IMAGE" -ec \
            'set -e
             test -s /ruoyi/server/script/video/workflows/video-workflow-contracts.json
             for wf in wf-t2v-h3 wf-i2v-h3 wf-fl2v-h3; do
               test -s "/ruoyi/server/script/video/workflows/api/$wf-v0.1.0.json"
             done
             command -v ffprobe
             command -v ffmpeg
             echo "contracts and media tools packaged OK"'

      - name: Export image with checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts/image
          docker save "$IMAGE" | gzip -1 > artifacts/image/backend-image.tar.gz
          cd artifacts/image
          sha256sum backend-image.tar.gz > SHA256SUMS

      - name: Upload backend image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-${{ github.sha }}
          path: artifacts/image/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish-image:
    name: Publish main image to GHCR
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-test-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package verified commit
        run: bash mvnw --batch-mode --no-transfer-progress -Dmaven.test.skip=true package

      # 与 build-test-image 一致：ffmpeg 归档走缓存，不留给 Dockerfile 现场下载。
      - name: Cache ffmpeg static archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache
          key: ffmpeg-static-abda8d77ce830914-41888096

      - name: Fetch ffmpeg static archive
        run: bash script/ci/fetch-ffmpeg.sh build-cache

      - name: Build image from verified commit
        run: |
          # 与 build-test-image 保持一致：构建上下文是仓库根，Dockerfile 在仓库根。
          # 这里曾漏改仍指向 ruoyi-admin，导致发布 job 报
          # `failed to read dockerfile: open Dockerfile: no such file or directory`。
          # 两处构建上下文必须始终一致。
          docker build --pull \
            -f Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "hotter-ai-platform-backend:${GITHUB_SHA}" .

      - name: Push commit-tagged image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "hotter-ai-platform-backend:${GITHUB_SHA}" "$image"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          printf '### Published image\n\n`%s`\n\nDigest: `%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
