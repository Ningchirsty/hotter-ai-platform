name: Backend CI

on:
  push:
    # 纯文档推送不再跑全量 CI（2026-10-09，运维要求）。
    #   * 只忽略**markdown**：docs/ 下还有非文档产物（`platform-v2/contract/*.schema.json`、
    #     样例、`validate-examples.py`），它们由本工作流的契约校验步骤把关，
    #     整目录忽略会让"改了契约却没人校验"——那正是要避免的静默。
    #   * ⚠️ 不忽略 script/sql/**：后端测试 AigPermissionSeedCoverageTest 会读菜单/权限脚本，
    #     只改 SQL 也必须跑 CI，否则"新权限没人种"这类问题会漏到线上（真发生过）。
    #   * ⚠️ 不忽略 script/deploy/**：那是生产发布与告警的实现，本工作流新增了 shell 校验步骤。
    #   * ⚠️ 刻意**不动 pull_request**：若将来分支保护把本工作流设为必需检查，
    #     被 paths-ignore 跳过的 PR 会永远等不到那个检查（GitHub 的已知坑）。
    #   * 顺带的取舍：被跳过的提交不会产出镜像；发布走的是显式 digest（见 deploy-poc.yml），
    #     不依赖"每个提交都有一个镜像"，所以这不影响发布通道。
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # 按「事件 + 分支」编组。原先是 `backend-ci-${head_ref || ref_name}`，push 与
  # workflow_dispatch 的 ref_name 相同（都是 main），于是"push 后再手动派发取制品"
  # 会把先前的 push 运行取消掉。把事件并入组名，避免这种跨事件互相取消。
  group: backend-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-image:
    name: Compile, test and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE: hotter-ai-platform-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        run: bash mvnw --batch-mode --no-transfer-progress -Dmaven.test.skip=false '-Dtest.groups=!exclude' verify

      - name: Verify tests actually ran
        run: python3 script/ci/check-test-results.py

      # 工作流契约/模板一致性测试（Node 内置 runner，无第三方依赖）。
      # 校验：模板存在、字节是规范格式、SHA-256 与契约一致、mapping 与模板节点三方对齐、
      # 模板里不残留样例提示词。
      # 此前这些测试**没有接进 CI**（只在 README 里要求人工跑），结果视频契约的状态与断言
      # 长期不一致却无人发现；本次把两个模块都纳入，避免同类问题再次静默。
      #
      # 2026-10-09：不再直接写两条 `node --test` 命令，改为守卫脚本——
      #   `node --test` 在"文件里没有测试"时**仍然退出 0**，而本仓已经因为"静默没跑"
      #   吃过两次亏（Surefire 门禁、@EnableScheduling）。守卫同时要求：
      #   每个 *.test.mjs 都在 TEST_FLOORS 里登记（新文件不会被漏接）、通过数不低于登记下限
      #   （测试被删空/全 skip 会红）、fail=0。详见 script/ci/check-node-contract-tests.py。
      # ---- Shell 脚本校验（2026-10-09 补：本仓此前对 *.sh **没有任何校验**）----
      # 为什么需要：`script/deploy/**` 是生产发布与告警的实现（含 root 入口 `hotter-release`），
      #   而一次 BOM / 行尾 / 引号失误的代价是"发布或告警静默失效"——R66 就因行尾缺陷吃过一次亏。
      # 为什么用 `git ls-files` 而不是 glob：要覆盖**仓库里被跟踪的**脚本，且把无扩展名的
      #   `script/deploy/hotter-release` 也算进来（漏掉它等于漏掉最要紧的那个）。
      # 为什么只 gate 到 `--severity=error`：全量 shellcheck 在本仓当前有 17 条风格级提示
      #   （SC2006/SC2268/SC2086/SC2034/SC2009/SC2126，2026-10-09 实测），直接开全量会训练人忽略告警；
      #   error 级已能抓住 BOM、坏 shebang、以及真正会改变行为的引号问题。想开全量就先清那 17 条。
      # 为什么 shellcheck 缺失要直接失败：静默跳过等于"看起来校验了、其实没有"（本项目反复强调的坑）。
      - name: Verify shell scripts (syntax + shellcheck errors)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' 'script/deploy/hotter-release')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell script found - did the discovery pattern break?" >&2
            exit 1
          fi
          echo "shell scripts under check: ${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          for f in "${scripts[@]}"; do bash -n "$f"; done
          command -v shellcheck >/dev/null 2>&1 || { echo "shellcheck missing on runner" >&2; exit 1; }
          shellcheck --severity=error --shell=bash "${scripts[@]}"
          echo "shell check OK"

      # ---- 执行契约样例校验（阶段 0 的"契约层阻断"搬进 CI，2026-10-09）----
      # 这个脚本自己就写着「阶段 1 应把它搬进 CI」（docs/platform-v2/contract/validate-examples.py）：
      #   它用 JSON Schema 校验 contract/examples/ 下的每个样例，并检查 error-codes.json 与
      #   result schema 的 errorCode 枚举一致。此前只在本地手工跑过 ⇒ 契约漂移无人拦。
      # 用 venv 装 jsonschema：Ubuntu 24.04 的 pip 受 PEP 668 保护，直接装系统环境会被拒。
      # 脚本缺 jsonschema 时会 exit 2（不静默跳过），这里前置安装是刻意的。
      - name: Verify execution contract examples
        run: |
          set -euo pipefail
          python3 -m venv /tmp/contract-venv
          /tmp/contract-venv/bin/pip install --quiet --disable-pip-version-check 'jsonschema>=4'
          /tmp/contract-venv/bin/python docs/platform-v2/contract/validate-examples.py

      - name: Verify workflow contracts
        run: python3 script/ci/check-node-contract-tests.py

      - name: Upload test reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.sha }}
          overwrite: true
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
          retention-days: 14

      - name: Package JAR with checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts/jar
          cp ruoyi-admin/target/ruoyi-admin.jar artifacts/jar/
          cd artifacts/jar
          sha256sum ruoyi-admin.jar > SHA256SUMS

      - name: Upload backend JAR
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          overwrite: true
          path: artifacts/jar/
          if-no-files-found: error
          retention-days: 7

      # ffmpeg 归档只下载一次并缓存，之后所有构建走缓存。
      #
      # 为什么不留给 Dockerfile 下载：该源站会对单个连接限速（实测每次请求 20 秒只能
      # 收到 0.8–7 MB，而归档共 41.9 MB），且 curl 的 --retry 不会对「传输太慢」重试。
      # 已因此让本流水线失败过两次。放在这里可以：只下一次、失败可重试整步、
      # 并通过缓存让后续构建完全不再访问该源。
      - name: Cache ffmpeg static archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache
          key: ffmpeg-static-abda8d77ce830914-41888096

      - name: Fetch ffmpeg static archive
        run: bash script/ci/fetch-ffmpeg.sh build-cache

      - name: Build backend image
        run: |
          # 构建上下文是仓库根（不是 ruoyi-admin）：镜像需要包含
          # script/video/workflows 下的工作流契约与模板，而 Docker 不允许
          # COPY 构建上下文之外的文件。Dockerfile 位于仓库根。
          # build-cache/ 内的 ffmpeg 归档由上一步预取，Dockerfile 直接 COPY。
          docker build --pull \
            -f Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" .

      - name: Smoke test image runtime and packaged JAR
        run: |
          docker run --rm --entrypoint /bin/bash "$IMAGE" -ec \
            'java -version; test -s /ruoyi/server/app.jar; test -w /ruoyi/server/logs; test -w /ruoyi/server/temp'

      - name: Smoke test packaged contracts and media tools
        run: |
          # 契约与模板是后端启动依赖，缺失会导致上下文初始化失败；
          # ffprobe/ffmpeg 是成片实测与截断的运行时依赖。
          # 这里显式校验，避免出现「镜像能构建但跑不起来」。
          docker run --rm --entrypoint /bin/bash "$IMAGE" -ec \
            'set -e
             test -s /ruoyi/server/script/video/workflows/video-workflow-contracts.json
             for wf in wf-t2v-h3 wf-i2v-h3 wf-fl2v-h3; do
               test -s "/ruoyi/server/script/video/workflows/api/$wf-v0.1.0.json"
             done
             test -s /ruoyi/server/script/image/workflows/image-workflow-contracts.json
             for wf in wf-t2i-qwen21 wf-i2i-qwen21 wf-edit-qwen21 wf-bgremove-qwen21; do
               test -s "/ruoyi/server/script/image/workflows/api/$wf-v0.1.0.json"
             done
             command -v ffprobe
             command -v ffmpeg
             echo "contracts and media tools packaged OK"'

      - name: Export image with checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts/image
          docker save "$IMAGE" | gzip -1 > artifacts/image/backend-image.tar.gz
          cd artifacts/image
          sha256sum backend-image.tar.gz > SHA256SUMS

      - name: Upload backend image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-${{ github.sha }}
          path: artifacts/image/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish-image:
    name: Publish main image to GHCR
    # 2026-10-08 修复：这里原本是 `event_name == 'push' && ...`，而下面若干产物步骤
    # （Upload test reports / Package JAR / Upload backend JAR / Export image /
    #  Upload backend image）的条件是 `event_name == 'workflow_dispatch'`。
    # 两组条件**互斥**，导致：push 的那次运行（唯一会推镜像的）不产出制品，
    # 而手动派发的那次（产出制品）又不推镜像。
    #
    # 实际后果（2026-10-08 亲历）：push 后又手动派发一次 CI 取制品，而本 workflow 的并发组是
    # `backend-ci-${head_ref || ref_name}`、两次运行同名且 cancel-in-progress: true，
    # 于是**先前的 push 运行被取消**——恰好是唯一会推镜像的那次。最后只能靠
    # `rerun-failed-jobs` 重跑被取消的运行才把镜像推上去。
    #
    # 现在两种事件都能发布；release 是幂等的（同一个 sha 标签重推是 no-op）。
    # 仍限定默认分支：re-run 会保持原 event_name，非默认分支的 re-run 不会被误放行。
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-test-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      # 与 build-test-image 分开编组：两者要产出不同东西（制品 vs 镜像），
      # 共用一组会让"push 完再手动派发"稳定地互相取消。
      group: backend-ci-publish-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package verified commit
        run: bash mvnw --batch-mode --no-transfer-progress -Dmaven.test.skip=true package

      # 与 build-test-image 一致：ffmpeg 归档走缓存，不留给 Dockerfile 现场下载。
      - name: Cache ffmpeg static archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-cache
          key: ffmpeg-static-abda8d77ce830914-41888096

      - name: Fetch ffmpeg static archive
        run: bash script/ci/fetch-ffmpeg.sh build-cache

      - name: Build image from verified commit
        run: |
          # 与 build-test-image 保持一致：构建上下文是仓库根，Dockerfile 在仓库根。
          # 这里曾漏改仍指向 ruoyi-admin，导致发布 job 报
          # `failed to read dockerfile: open Dockerfile: no such file or directory`。
          # 两处构建上下文必须始终一致。
          docker build --pull \
            -f Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "hotter-ai-platform-backend:${GITHUB_SHA}" .

      - name: Push commit-tagged image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "hotter-ai-platform-backend:${GITHUB_SHA}" "$image"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          printf '### Published image\n\n`%s`\n\nDigest: `%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
