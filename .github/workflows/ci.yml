name: Backend CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish tested immutable backend artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          gh run download 38013711257 --repo Ningchirsty/hotter-ai-platform --name backend-image-63f3c8ab9b8e0fc11eb37b7acd77a63ab5374282 --dir backend
          (cd backend && sha256sum -c SHA256SUMS)
          docker load --input backend/backend-image.tar.gz
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' hotter-ai-platform-backend:63f3c8ab9b8e0fc11eb37b7acd77a63ab5374282)" = 63f3c8ab9b8e0fc11eb37b7acd77a63ab5374282
          docker tag hotter-ai-platform-backend:63f3c8ab9b8e0fc11eb37b7acd77a63ab5374282 ghcr.io/ningchirsty/hotter-ai-platform-backend:sha-63f3c8ab9b8e0fc11eb37b7acd77a63ab5374282
          docker push ghcr.io/ningchirsty/hotter-ai-platform-backend:sha-63f3c8ab9b8e0fc11eb37b7acd77a63ab5374282
