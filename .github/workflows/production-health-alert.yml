name: Production Health Alert

# 2026-10-08 P0 事故后新增：那一次后端完全不可用，**没有任何告警**——
# 我是靠盯着 deploy run 才发现失败的。更隐蔽的是从公网看不出来：
# ruoyi-web 是 nginx，对任何路径都回 200 + SPA 的 index.html（含 /actuator/health），
# 所以"站点是活的"与"后端是活的"是两件事。
#
# 因此本 workflow 在 self-hosted runner（与后端同主机）上**直连后端** 127.0.0.1:18082 探测，
# 并要求响应体是 JSON，而不是只看状态码。
#
# 告警落地方式选择说明：
#   本仓库没有任何 webhook/告警通道（已核实：无 schedule、无 webhook secret）。
#   因此用**本仓库的 Issue** 作为告警收件箱——它只需 GITHUB_TOKEN，不依赖任何外部服务，
#   且会在 GitHub 通知里推送给 watching 的人。同一问题不新建、只更新同一个 issue
#   （避免每 5 分钟刷一条）。
on:
  schedule:
    # 每 5 分钟。注意：schedule 只在默认分支上生效。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      probe_url:
        description: 'Override the probe target (used to verify the alert path itself)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-alert
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production backend availability
    # 与部署 workflow 用同一组标签：必须是宿主机上的 runner，才能直连 127.0.0.1:18082
    runs-on: [shenzhen, deploy]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run health check
        id: health
        continue-on-error: true
        env:
          # 允许手动指定探针目标，用于**验证告警通路本身**（例如故意指向一个不可达端口，
          # 确认真的会创建 issue），而不必去破坏生产。留空则用 health-check.sh 的默认值。
          HOTTER_BACKEND_PROBE_URL: ${{ inputs.probe_url }}
        run: |
          # 不能写 `set -o pipefail`：health-check 非 0 退出（正是我们要捕获的信号）会让
          # 整个 step 在到达 "echo rc=" 之前就中止，于是 rc 输出为空、告警步骤被 skip。
          # 首次实跑就踩了这个坑（run 37763243678：脚本已判 CRITICAL，却没建 issue）。
          set -u
          rc=0
          bash script/deploy/health-check.sh > /tmp/health-report.txt 2>&1 || rc=$?
          cat /tmp/health-report.txt
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          {
            echo "## Production health check"
            echo
            echo '```'
            cat /tmp/health-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raise or update the alert issue
        if: steps.health.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.health.outputs.rc }}
        run: |
          set -uo pipefail
          # GitHub 给 run 注入的是 `bash -e`。2026-10-09 14:29 那次运行就是被它害的：
          # curl 退出码 6（DNS 解析不了 api.github.com）让本步骤在**任何输出之前**中止，
          # 日志里只剩一句 `exit code 6`，看不出是网络问题还是权限问题。
          # 这里显式关掉 -e，自己处理失败并把它说清楚。
          set +e
          # curl 5 秒内解析不了域名就该重试；--retry-all-errors 只在支持的 curl 上加
          # （旧 curl 会把未知选项当错误直接退出）。
          RETRY=(--retry 3 --retry-delay 2)
          if curl --help all 2>/dev/null | grep -q -- '--retry-all-errors'; then
            RETRY+=(--retry-all-errors)
          fi
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")
          label="ops/health-alert"
          api_failed=0
          # 用 curl 调 REST API，而不是 gh CLI：self-hosted runner 上**没有装 gh**
          # （首次运行实测报 `gh: command not found`，exit 127）。curl 是判断平台必备，无新依赖。
          call() {
            curl -sS "${RETRY[@]}" "$@"
            local rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::curl 退出码 $rc（目标 $API）——GitHub API 不可达或超时"
              api_failed=1
            fi
            return 0
          }
          # 标签不存在则创建（404 是正常的首次运行）
          call -o /dev/null -X POST "${auth[@]}" "$API/labels" \
            -d "{\"name\":\"$label\",\"color\":\"d73a4a\",\"description\":\"production health alert\"}"

          if [ "$RC" = "2" ]; then
            TITLE="[生产告警] 健康巡检有 WARN（未中断服务）"
          else
            TITLE="[生产告警] 后端不可用或部署条件不满足"
          fi
          BODY=$(jq -n --arg t "$TITLE" --arg b "$(printf '健康巡检在 %s 报告异常（rc=%s）。\n\n```\n%s\n```\n\n巡检脚本：`script/deploy/health-check.sh`\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$RC" "$(cat /tmp/health-report.txt)")" \
            '{title:$t, body:$b, labels:["ops/health-alert"]}')

          # 只维护一个 issue：按标签找 open 的，存在则评论更新，不存在则创建
          NUM=$(call "${auth[@]}" "$API/issues?state=open&labels=$label&per_page=5" \
            | jq -r '.[0].number // empty')
          if [ -n "${NUM:-}" ]; then
            call -o /dev/null -X POST "${auth[@]}" "$API/issues/$NUM/comments" \
              -d "$(jq -n --arg b "$(printf '再次异常（rc=%s）于 %s\n\n```\n%s\n```' \
                    "$RC" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$(cat /tmp/health-report.txt)")" '{body:$b}')"
            echo "updated alert issue #$NUM"
          else
            call -X POST "${auth[@]}" "$API/issues" -d "$BODY" | jq -r '"created alert issue #\(.number) \(.html_url)"'
          fi

          # 生产异常但告警发不出去 = 最坏的情况，必须红得显眼，并且原因可读。
          # （即便这里不 exit 1，后面的 Fail the run 也会让 run 变红；这里是为了说清为什么。）
          if [ "$api_failed" -ne 0 ]; then
            echo "::error::生产巡检报告异常（rc=$RC），但 GitHub API 不可达，告警 issue 可能未创建/未更新——请把这条红色 run 本身当作告警。"
            exit 1
          fi

      - name: Close the alert issue when healthy again
        if: steps.health.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e   # 同上一处：不让 -e 把失败变成没有输出的一行 "exit code N"
          RETRY=(--retry 3 --retry-delay 2)
          if curl --help all 2>/dev/null | grep -q -- '--retry-all-errors'; then
            RETRY+=(--retry-all-errors)
          fi
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")
          api_failed=0
          call() {
            curl -sS "${RETRY[@]}" "$@"
            local rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::curl 退出码 $rc（目标 $API）——GitHub API 不可达或超时"
              api_failed=1
            fi
            return 0
          }
          NUM=$(call "${auth[@]}" "$API/issues?state=open&labels=ops/health-alert&per_page=5" \
            | jq -r '.[0].number // empty')
          if [ -n "${NUM:-}" ]; then
            call -o /dev/null -X POST "${auth[@]}" "$API/issues/$NUM/comments" \
              -d "{\"body\":\"健康巡检在 $(date -u '+%Y-%m-%dT%H:%M:%SZ') 恢复正常，自动关闭。\"}"
            call -o /dev/null -X PATCH "${auth[@]}" "$API/issues/$NUM" \
              -d '{"state":"closed","state_reason":"completed"}'
            echo "closed alert issue #$NUM"
          else
            echo "no open alert issue; nothing to close"
          fi
          # 生产是健康的，这里失败只意味着"关不掉一条过期的告警"——那不是生产事故。
          # 记 warn、**不**把 run 弄红：为这种事制造红色只会训练大家忽略红色。
          if [ "$api_failed" -ne 0 ]; then
            echo "::warning::生产健康，但 GitHub API 不可达，告警 issue 未能自动关闭（下次巡检会再试）。"
          fi

      - name: Fail the run so it is visible in Actions
        if: steps.health.outputs.rc != '0'
        run: |
          echo "health check reported rc=${{ steps.health.outputs.rc }}" >&2
          exit 1
