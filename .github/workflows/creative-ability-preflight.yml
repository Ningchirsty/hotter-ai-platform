name: Creative Ability Release Preflight

on:
  push:
    branches: [codex/creative-abilities-production]
    paths: [.github/workflows/creative-ability-preflight.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-ability-release-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [shenzhen, deploy]
    timeout-minutes: 5
    steps:
      - name: Verify candidate execution prerequisites without changing production
        run: |
          python3 - <<'PY'
          import json, os, shutil, stat, subprocess, urllib.error, urllib.request
          report = {}
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def command(args, input=None):
              try:
                  result = subprocess.run(args, input=input, capture_output=True, text=True, timeout=15)
                  return result.returncode == 0, result.stdout.strip()
              except (OSError, subprocess.TimeoutExpired):
                  return False, ''
          report['host'] = command(['hostname'])[1]
          report['runnerUser'] = command(['id', '-un'])[1]
          report['rootFreeMB'] = shutil.disk_usage('/').free // 1048576
          docker_ok, version = command(['docker', 'version', '--format', '{{.Server.Version}}'])
          report['dockerAvailable'] = docker_ok
          report['dockerServerVersion'] = version if docker_ok else None
          entrypoint = '/usr/local/sbin/hotter-release'
          report['releaseEntrypoint'] = dict(exists=os.path.exists(entrypoint), executable=os.access(entrypoint, os.X_OK))
          try:
              metadata = os.stat(entrypoint)
              report['releaseEntrypoint'].update(ownerUid=metadata.st_uid, mode=oct(stat.S_IMODE(metadata.st_mode)))
          except OSError as error:
              report['releaseEntrypoint']['errorType'] = type(error).__name__
          try:
              validation = subprocess.run(['sudo', '-n', entrypoint], capture_output=True, text=True, timeout=15)
              report['releaseEntrypoint']['sudoValidationAvailable'] = (
                  validation.returncode == 1 and 'operation must be backend or frontend' in validation.stderr)
          except (OSError, subprocess.TimeoutExpired):
              report['releaseEntrypoint']['sudoValidationAvailable'] = False
          report['productionContainers'] = command(['docker', 'ps', '--format', '{{.Names}} {{.Image}} {{.Status}}'])[1].splitlines()
          # Presence/length only. Never print production keys, environment lists, or private.env.
          key_check = '''key="${MYBATIS_ENCRYPTOR_PASSWORD:-${HR_ENCRYPT_KEY:-}}"
          if [[ "$JAVA_OPTS" =~ -Dmybatis-encryptor.password=([^[:space:]]+) ]]; then key="${BASH_REMATCH[1]}"; fi
          count=$(printf '%s' "$key" | wc -c)
          case "$count" in 16|24|32) exit 0;; *) exit 1;; esac'''
          report['productionAesKeyReady'] = command(['docker','exec','ai-video-poc-backend-1','/bin/bash','-c',key_check])[0]
          schema_query = '''SELECT
          (SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='video_task' AND column_name='platform_task_id'),
          (SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='video_task' AND index_name='uk_task_platform' AND column_name='platform_task_id' AND non_unique=0);'''
          schema_ok, schema = command(['docker','exec','-i','ai-video-poc-mysql-1','sh','-c',
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -uroot -D ai_video_poc -N -B'], input=schema_query)
          report['productionVideoSchemaReady'] = schema_ok and schema.split()==['1','1']
          for key, url in [('comfy', 'http://192.168.2.223:8188/queue'),
                           ('localProductionBackend', 'http://127.0.0.1:18082/auth/code'),
                           ('productionBackend', 'https://pm.hottter.cn/prod-api/auth/code'),
                           ('productionFrontend', 'https://pm.hottter.cn/version.json')]:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Hotter-Release-Preflight/1.0', 'Accept': 'application/json'})
                  with opener.open(request, timeout=15) as response:
                      data = json.load(response)
                  if key == 'comfy':
                      report[key] = dict(ok=True, running=len(data['queue_running']), pending=len(data['queue_pending']))
                  elif key in ('productionBackend', 'localProductionBackend'):
                      report[key] = dict(ok=data.get('code') == 200)
                  else:
                      report[key] = dict(ok=bool(data.get('gitSha')), gitSha=data.get('gitSha'))
              except urllib.error.HTTPError as error:
                  report[key] = dict(ok=False, errorType=type(error).__name__, httpStatus=error.code)
              except Exception as error:
                  report[key] = dict(ok=False, errorType=type(error).__name__)
          report['readyForIsolatedCandidate'] = all([
              docker_ok, report['rootFreeMB'] >= 3072, report['comfy']['ok']])
          report['readyForProductionRelease'] = all([
              report['releaseEntrypoint']['exists'], report['releaseEntrypoint']['sudoValidationAvailable'],
              report['localProductionBackend']['ok'], report['rootFreeMB'] >= 3072,
              report['productionAesKeyReady'], report['productionVideoSchemaReady']])
          print(json.dumps(report, indent=2))
          # This is a prerequisite check, not task acceptance or deployment.
          raise SystemExit(0 if report['readyForIsolatedCandidate'] else 1)
          PY
