name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: frontend-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-image:
    name: Build and test frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: hotter-ai-platform-frontend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      # 重复声明守卫。放在 lint 之前：它不依赖 node_modules，几毫秒即可给出
      # 「同一作用域内声明了两次」这种致命错误（CI 曾报过
      # `Identifier 'previewTask' has already been declared`：同名的 ref 与函数）。
      - name: Guard against duplicate top-level declarations
        run: node script/ci/check-script-setup.mjs $(git ls-files '*.vue')

      - name: Build frontend image
        run: |
          docker build --pull \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" frontend

      - name: Smoke test frontend image
        run: |
          docker run -d --name frontend-smoke -e LISTEN_PORT=8080 "$IMAGE"
          trap 'docker rm -f frontend-smoke >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 12); do
            if docker exec frontend-smoke wget --spider --quiet http://127.0.0.1:8080/version.json; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs frontend-smoke
            exit 1
          fi
          docker exec frontend-smoke wget -qO- http://127.0.0.1:8080/version.json | \
            grep -F "\"gitSha\":\"${GITHUB_SHA}\""

      - name: Export frontend image with checksum
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts/image
          docker save "$IMAGE" | gzip -1 > artifacts/image/frontend-image.tar.gz
          cd artifacts/image
          sha256sum frontend-image.tar.gz > SHA256SUMS

      - name: Upload frontend image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-image-${{ github.sha }}
          path: artifacts/image/
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish-image:
    name: Publish frontend image to GHCR
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-test-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and push verified commit
        env:
          IMAGE: ghcr.io/ningchirsty/hotter-ai-platform-frontend:sha-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build --pull \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE" frontend
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          printf '### Published image\n\n`%s`\n\nDigest: `%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
