name: Deploy Shenzhen Production Backend

on:
  workflow_dispatch:
    inputs:
      image:
        # ⚠️ 刻意**不设默认值**（2026-10-12 移除）。这里原先写着一个具体 digest 作默认值，
        #   于是"直接点 Run workflow"会**重新部署那个旧镜像**：部署成功、容器健康、版本号也对，
        #   但本次要上线的改动一个都没生效——排查时第一反应会怀疑代码而不是输入框。
        #   发布通道本来就要求"逐次填写经审核的不可变 digest"（见 script/deploy/README.md），
        #   留空后 GitHub 会强制填写；前端发布工作流 deploy-frontend-poc.yml 也一直是这么做的。
        description: 'Immutable GHCR backend image reference, e.g. ghcr.io/ningchirsty/hotter-ai-platform-backend@sha256:<64 hex>'
        required: true
        type: string
      allow_unknown_disk:
        description: 'Emergency override: proceed even if root free space cannot be read (default false; the pre-flight refuses instead)'
        required: false
        type: boolean
        default: false
      preload_archive_sha256:
        description: Optional SHA256 of the reviewed OCI archive exported by the main CI run
        required: false
        type: string
      preload_archive_bytes:
        description: Optional byte size paired with the reviewed archive checksum
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shenzhen-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable backend image
    runs-on: [shenzhen, deploy]
    timeout-minutes: 20
    environment:
      name: shenzhen-production
      url: https://pm.hottter.cn
    steps:
      - name: Validate image reference
        env:
          IMAGE: ${{ inputs.image }}
          ARCHIVE_SHA: ${{ inputs.preload_archive_sha256 }}
          ARCHIVE_BYTES: ${{ inputs.preload_archive_bytes }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE" =~ ^ghcr\.io/ningchirsty/hotter-ai-platform-backend@sha256:[0-9a-f]{64}$ ]]; then
            echo "Image must be the expected immutable GHCR digest." >&2
            exit 1
          fi
          if [ -n "$ARCHIVE_SHA$ARCHIVE_BYTES" ]; then
            [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ && "$ARCHIVE_BYTES" =~ ^[1-9][0-9]{0,9}$ ]] || exit 1
          fi

      # 2026-10-08 P0 事故后新增：部署前预检。
      # 事故经过：根分区写满 → 容器只创建成功、无法启动 → 健康检查超时 → **回滚也因写满失败**
      # → 后端完全不可用。hotter-release 里已加同样的防线，但那份脚本是 root 所有、
      # 需人工 install 才生效；本步骤只依赖 runner 的 docker 权限，**提交即可生效**，
      # 因此作为"立刻可用的那一层"。
      - name: Pre-flight host capacity
        env:
          MIN_FREE_KB: '3145728'
          KEEP_PREVIOUS: '3'
          # 读不到磁盘状态时是否放行（默认否）。见下面说明。
          ALLOW_UNKNOWN_DISK: ${{ inputs.allow_unknown_disk && '1' || '0' }}
        run: |
          set -uo pipefail
          free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # 单调增长的陈旧 previous-* 容器是本次事故的堆积源之一，先清掉（保留最近几个）
          stale=$(docker ps -a --filter 'name=ruoyi-web-previous-' --format '{{.Names}}' \
            | sort -r | tail -n +$((KEEP_PREVIOUS + 1)))
          if [ -n "$stale" ]; then
            echo "$stale" | xargs -r docker rm >/dev/null 2>&1 || true
            echo "pruned stale previous-* containers, kept newest $KEEP_PREVIOUS"
          fi
          # ⚠️ 这道预检存在的意义就是"磁盘满时部署与回滚会一起失败"（2026-10-08 事故）。
          # 所以**读不到磁盘状态必须拒绝**。原先直接拿 $free_kb 去比较：一旦 df 输出异常/为空，
          # `[ "" -lt N ]` 返回非 0（被当作 false），预检就静默通过了——
          # 恰好在它最该起作用的时候（文件系统异常）失效。修成 fail-closed，
          # 并留一个显式口子 allow_unknown_disk（应急用，会在日志里留痕）。
          if ! [[ "$free_kb" =~ ^[0-9]+$ ]]; then
            if [ "${ALLOW_UNKNOWN_DISK:-0}" = "1" ]; then
              echo "::warning::cannot read root free space (df gave '${free_kb:-<empty>}'); proceeding because allow_unknown_disk was requested"
            else
              echo "::error::cannot read root free space (df gave '${free_kb:-<empty>}'). Deploy AND rollback both need disk, so refusing to start. Re-run with the allow_unknown_disk input set to true to override."
              exit 1
            fi
          else
            echo "root free: $((free_kb / 1024))MB (require >= $((MIN_FREE_KB / 1024))MB)"
            if [ "$free_kb" -lt "$MIN_FREE_KB" ]; then
              echo "::error::root filesystem has only $((free_kb / 1024))MB free (< $((MIN_FREE_KB / 1024))MB). Deploy AND rollback both need disk; refusing to start."
              exit 1
            fi
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Preload the reviewed immutable CI image when requested
        if: inputs.preload_archive_sha256 != ''
        env:
          IMAGE: ${{ inputs.image }}
          ARCHIVE_SHA: ${{ inputs.preload_archive_sha256 }}
          ARCHIVE_BYTES: ${{ inputs.preload_archive_bytes }}
        run: |
          python3 script/ci/registry-image-archive.py load "$IMAGE" "$GITHUB_SHA" \
            --archive-sha256 "$ARCHIVE_SHA" --archive-bytes "$ARCHIVE_BYTES"

      # Latest main adds mapper fields and tables since the deployed version.
      # Replay only additive incremental/schema scripts; never baseline DROP/seed/menu SQL.
      #
      # ⚠️ 两类脚本都必须在清单里，漏了会**部署成功但接口 500**（2026-10-12 补）：
      #   * 建表类：CREATE TABLE IF NOT EXISTS，可重复执行；
      #   * 补列类：MySQL 8.0 没有 ADD COLUMN IF NOT EXISTS，这些脚本改用
      #     information_schema 判断 + PREPARE 动态执行 DDL，同样是幂等的、可重复执行。
      #     早先只收了建表类，11 份补列迁移一直没被重放 ⇒ 线上库缺列，而 RuoYi 把 SQL 异常
      #     掩成「发生未知异常，请联系管理员」，响应体和日志都看不出缺的是哪一列。
      #     这份清单由构建期守卫 AigDeploySchemaReplayCoverageTest 把关（新增补列脚本
      #     忘了加进来、或加进来但不幂等，CI 直接红）。
      #   ℹ️ v1.0 优化分支新增的表/列也一并收在这里（launch_template / knowledge / tool /
      #     result_feedback / task_step 五张表 + task_step 的节点身份两列），
      #     理由同上：只写在文档里的"部署清单"没人会在切镜像前照着执行，
      #     漏掉的后果就是"部署成功但接口 500"。它们分别是 create table if not exists
      #     与 information_schema+PREPARE，都可重复执行。
      #     ⚠️ 权限/页面种子（aig_*_menu.sql / aig_*_pages.sql）**不在此列**：
      #     它们插的是 sys_menu/sys_role_menu，属"授权变更"，应由运维按 §5 清单显式执行。
      - name: Prepare additive runtime schema before switching backend
        run: |
          set -euo pipefail
          for migration in \
            aig_agent_resource_binding.sql aig_asset_index.sql aig_launch_record.sql \
            aig_role_workspace.sql aig_sandbox_artifact_download.sql \
            aig_studio_artifact_draft.sql aig_studio_change_proposal.sql aig_studio_copilot_turn.sql \
            aig_user_brand.sql aig_user_workspace_pref.sql \
            cp_task_platform_ref.sql ry_video_task_platform_ref.sql \
            aig_audit_provider_usage.sql aig_evaluation_run_executed_by.sql \
            aig_invoke_agent_version.sql aig_invoke_error_class.sql \
            aig_model_capability_tags.sql aig_model_cost_limit_amount.sql \
            aig_package_version_body_ref.sql aig_route_scenario_binding.sql \
            aig_sandbox_run_attestation.sql aig_skill_version_package_ref.sql \
            aig_task_execution_mode.sql \
            aig_launch_template.sql aig_knowledge.sql aig_tool.sql \
            aig_result_feedback.sql aig_task_step.sql \
            aig_task_step_node_identity.sql; do
            test -s "script/sql/$migration"
            echo "Preparing additive runtime schema: $migration"
            docker exec -i ai-video-poc-mysql-1 sh -c \
              'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql --default-character-set=utf8mb4 -uroot -D ai_video_poc' \
              < "script/sql/$migration"
          done

      - name: Deploy and verify backend through audited entrypoint
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/hotter-release backend "$IMAGE"
