                      if docker('inspect',name,'--format','{{index .Config.Labels "hotter.creative.acceptance"}}') == RUN:
                          docker('rm','-f','-v',name)
                  except Exception:
                      print('CANDIDATE_CLEANUP_REQUIRES_ATTENTION',name,flush=True)
              if network_created:
                  try:
                      if docker('network','inspect',PREFIX,'--format','{{index .Labels "hotter.creative.acceptance"}}') == RUN:
                          docker('network','rm',PREFIX)
                  except Exception:
                      print('CANDIDATE_NETWORK_CLEANUP_REQUIRES_ATTENTION',PREFIX,flush=True)
              try:
                  if docker('image','inspect',IMAGE,'--format','{{index .Config.Labels "org.opencontainers.image.revision"}}') == report['commit']:
                      docker('image','rm',IMAGE)
              except Exception:
                  print('CANDIDATE_IMAGE_CLEANUP_REQUIRES_ATTENTION',flush=True)
          PY
      - name: Upload task evidence and generated media
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creative-platform-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hotter-ability-${{ github.run_id }}-${{ github.run_attempt }}/candidate-results/
          if-no-files-found: warn
          retention-days: 7
